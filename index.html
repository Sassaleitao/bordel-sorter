<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bordel Amigável Sorter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cartaz desportivo azul e branco; faixa listrada azul com filete branco, linhas brancas sobre azul, itálico condensado. Tema único, claro por escolha. */
:root {
  --navy: #0a1f4d;
  --navy-2: #12306e;
  --blue: #1546c4;
  --blue-2: #1d55dc;
  --sky: #e6eeff;
  --white: #ffffff;
  --page: #f2f5fb;
  --ink: #0a1f4d;
  --ink-soft: #5b6b90;
  --line: #d3ddf2;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
.disp { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .005em; }

/* ---------- brasão com a foto do grupo ---------- */
.crest { width: 76px; height: 76px; flex: none; border-radius: 50%; overflow: hidden; border: 3px solid var(--white); box-shadow: 0 0 0 3px var(--blue-2), 0 6px 18px rgba(10, 31, 77, .35); background: var(--navy); }
.crest img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- faixa listrada ---------- */
.band { position: relative; overflow: hidden; color: var(--white); background: var(--navy) repeating-linear-gradient(90deg, var(--navy) 0 44px, var(--navy-2) 44px 88px); padding: 22px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: clamp(14px, 3vw, 28px); border-bottom: 6px solid var(--white); box-shadow: 0 6px 0 var(--blue-2); }
.band h1 { margin: 0; font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(34px, 7vw, 60px); line-height: .9; text-transform: uppercase; text-wrap: balance; }
.band p { margin: 6px 0 0; color: #c4d3f5; font-weight: 500; font-size: 14px; }

/* ---------- hero do início ---------- */
.hero { position: relative; border-radius: 20px; overflow: hidden; background: var(--navy); color: var(--white); min-height: 260px; display: flex; align-items: flex-end; box-shadow: 0 14px 40px rgba(10, 31, 77, .22); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 31, 77, 0) 25%, rgba(10, 31, 77, .55) 55%, rgba(10, 31, 77, .96) 100%); }
.hero-in { position: relative; z-index: 1; padding: 22px clamp(16px, 4vw, 34px); display: flex; align-items: center; gap: 16px; width: 100%; }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(40px, 9vw, 76px); line-height: .88; text-transform: uppercase; }
.hero p { margin: 6px 0 0; color: #d6e1fa; font-weight: 600; font-size: 14px; }

/* ---------- secções ---------- */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--navy); padding-bottom: 6px; }
.section-h h2 { margin: 0; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 26px; text-transform: uppercase; color: var(--navy); }
.section-h small { color: var(--ink-soft); font-size: 13px; }

.me-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.me-row label { font-weight: 700; color: var(--navy); }
.field { background: var(--white); border: 2px solid var(--line); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; flex: 1 1 180px; max-width: 320px; }
.field:focus { border-color: var(--blue-2); outline: none; }
.field::placeholder { color: var(--ink-soft); opacity: .8; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.cat { position: relative; text-align: left; border: 0; border-radius: 14px; background: var(--white); color: var(--ink); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 128px; box-shadow: 0 0 0 1px var(--line), 0 3px 0 var(--blue); transition: transform .12s ease, box-shadow .12s ease; overflow: hidden; }
.cat::before { content: ""; position: absolute; inset: 0 0 auto auto; width: 64px; height: 100%; background: repeating-linear-gradient(90deg, var(--sky) 0 10px, transparent 10px 20px); opacity: .9; }
.cat > * { position: relative; }
.cat:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--line), 0 6px 0 var(--blue); }
.cat .cat-name { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 32px; line-height: .95; text-transform: uppercase; color: var(--navy); }
.cat .cat-q { color: var(--ink-soft); font-size: 13.5px; font-weight: 500; flex: 1; }
.cat .cat-state { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; background: var(--sky); color: var(--navy); }
.cat .cat-state.mid { background: var(--blue-2); color: var(--white); }
.cat .cat-state.done { background: var(--navy); color: var(--white); }

.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mem { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px; border-radius: 99px; border: 1px solid var(--line); background: var(--white); text-align: left; min-width: 0; transition: opacity .12s; }
.mem .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mem[aria-pressed="false"] { opacity: .4; }
.mem[aria-pressed="false"] .nm { text-decoration: line-through; }

/* ---------- avatar ---------- */
.av { position: relative; flex: none; width: var(--s, 36px); height: var(--s, 36px); border-radius: 50%; background: var(--sky); overflow: hidden; display: grid; place-items: center; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .ini { font-family: var(--display); font-weight: 800; font-style: italic; color: var(--blue); font-size: calc(var(--s, 36px) * .42); line-height: 1; }

/* ---------- botões ---------- */
.btn { border: 0; border-radius: 99px; padding: 11px 18px; font-weight: 700; font-size: 14px; background: var(--blue); color: var(--white); }
.btn:hover { background: var(--blue-2); }
.btn:disabled { opacity: .35; cursor: default; }
.btn-ghost { background: var(--white); color: var(--navy); box-shadow: inset 0 0 0 2px var(--line); }
.btn-ghost:hover { background: var(--sky); }
.btn-tie { background: var(--navy); color: var(--white); }
.btn-tie:hover { background: var(--navy-2); }

/* ---------- frente a frente ---------- */
.battle { display: flex; flex-direction: column; gap: 16px; }
.battle-head { border-radius: 16px; }
.battle-head .crest { width: 52px; height: 52px; }
.battle-head h1 { font-size: clamp(28px, 5vw, 40px); }
.battle-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .25s ease; }
.battle-q { margin: 4px 0 0; text-align: center; font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(30px, 6vw, 46px); text-transform: uppercase; line-height: .95; color: var(--navy); text-wrap: balance; }
.arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(8px, 2vw, 18px); }
.vs { font-family: var(--display); font-weight: 800; font-style: italic; color: var(--blue); font-size: clamp(26px, 4vw, 38px); }
.pick { position: relative; border: 0; border-radius: 20px; background: var(--white); color: var(--ink); padding: clamp(18px, 3vw, 28px) 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 0 0 1px var(--line), 0 5px 0 var(--blue); transition: transform .1s ease, box-shadow .1s ease; min-width: 0; }
.pick:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--line), 0 8px 0 var(--blue); }
.pick:active, .pick.hit { transform: translateY(3px); box-shadow: 0 0 0 1px var(--line), 0 1px 0 var(--blue); }
.pick .av { --s: clamp(104px, 22vw, 172px); box-shadow: 0 0 0 4px var(--white), 0 0 0 7px var(--blue); }
.pick-name { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(22px, 3.8vw, 32px); line-height: .98; text-transform: uppercase; text-align: center; overflow-wrap: anywhere; color: var(--navy); }
.pick-key { position: absolute; top: 10px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pick[data-pick="left"] .pick-key { left: 14px; }
.pick[data-pick="right"] .pick-key { right: 14px; }
.battle-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.hint { margin: 0; text-align: center; color: var(--ink-soft); font-size: 12.5px; }

/* ---------- cartaz final (para print) ---------- */
.poster { border-radius: 18px; overflow: hidden; background: var(--blue); box-shadow: 0 18px 50px rgba(10, 31, 77, .3); }
.board { padding: clamp(18px, 3.5vw, 34px) clamp(12px, 4vw, 40px) 8px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--white); color: var(--ink); border-radius: 14px; min-width: 0; }
.row .rk { font-family: var(--display); font-weight: 800; font-style: italic; color: var(--blue); text-align: center; font-variant-numeric: tabular-nums; flex: none; line-height: 1; }
.row .rk small { font-size: .78em; }
.row .nm { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; line-height: 1; min-width: 0; overflow-wrap: anywhere; color: var(--navy); }
.row.big { padding: 14px clamp(14px, 3vw, 28px); gap: clamp(12px, 3vw, 26px); background: var(--sky); }
.row.big .rk { font-size: clamp(38px, 7vw, 56px); width: 1.5em; }
.row.big .av { --s: clamp(60px, 10vw, 82px); box-shadow: 0 0 0 3px var(--white), 0 0 0 5px var(--blue); }
.row.big .nm { font-size: clamp(26px, 4.6vw, 38px); }
.row.big .sub { font-family: var(--body); font-style: normal; font-weight: 600; font-size: 13.5px; color: var(--ink-soft); text-transform: none; margin-top: 4px; display: block; letter-spacing: 0; }
.row.big.r1 { background: var(--navy); }
.row.big.r1 .rk, .row.big.r1 .nm { color: var(--white); }
.row.big.r1 .sub { color: #b9c9ef; }
.rest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(var(--rows3), auto); gap: 8px 12px; margin-top: 4px; }
.row.sm { padding: 6px 10px; gap: 9px; }
.row.sm .rk { font-size: 22px; width: 1.7em; }
.row.sm .av { --s: 32px; }
.row.sm .nm { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; padding-right: 2px; }
.poster-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 18px clamp(12px, 4vw, 40px) 22px; margin-top: 14px; border-top: 1px solid rgba(255, 255, 255, .28); color: var(--white); }
.poster-foot .cta { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(24px, 3.6vw, 32px); text-transform: uppercase; }
.poster-foot .dt { font-weight: 600; font-size: clamp(14px, 2.4vw, 19px); }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- histórico ---------- */
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--white); text-align: left; flex-wrap: wrap; }
.hist-item b { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 20px; text-transform: uppercase; color: var(--blue); min-width: 110px; }
.hist-item span { color: var(--ink-soft); font-size: 13px; flex: 1; min-width: 0; }
.empty { color: var(--ink-soft); font-size: 13.5px; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--navy); color: var(--white); font-weight: 700; padding: 10px 16px; border-radius: 99px; transition: .2s ease; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 620px) {
  .rest { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows2), auto); }
  .crest { width: 58px; height: 58px; }
  .hero { min-height: 220px; }
}
@media (max-width: 460px) {
  .arena { grid-template-columns: 1fr; }
  .vs { text-align: center; line-height: 1; }
  .pick { flex-direction: row; justify-content: flex-start; padding: 14px 16px; gap: 16px; }
  .pick .av { --s: 84px; }
  .pick-name { text-align: left; }
  .pick-key { display: none; }
  .rest { gap: 5px 8px; margin-top: 2px; }
  .row.sm { padding: 4px 8px 4px 4px; gap: 6px; min-height: 37px; border-radius: 11px; }
  .row.sm .rk { font-size: 18px; width: 1.65em; }
  .row.sm .av { --s: 25px; }
  .row.sm .nm { font-size: 15px; line-height: 1; white-space: normal; overflow: visible; overflow-wrap: anywhere; }
  .board { padding: 12px 10px 4px; gap: 7px; }
  .row.big { padding: 7px 12px; gap: 10px; border-radius: 12px; }
  .row.big .rk { width: 1.25em; font-size: 32px; }
  .row.big .av { --s: 46px; }
  .row.big .nm { font-size: 23px; }
  .row.big .sub { font-size: 12.5px; margin-top: 2px; }
  .poster .band { padding: 14px; gap: 12px; }
  .poster .crest { width: 48px; height: 48px; }
  .poster .band h1 { font-size: 32px; }
  .poster .band p { font-size: 12.5px; margin-top: 3px; }
  .poster-foot { padding: 10px 12px 12px; margin-top: 8px; }
  .poster-foot .cta { font-size: 20px; }
  .poster-foot .dt { font-size: 12.5px; }
  .wrap { padding-block: 12px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>

const store = {
  get(k, d) { try { const v = localStorage.getItem("ba:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ba:" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("ba:" + k); } catch (e) {} }
};

/* ---------- ordenação por fusão com empates (engenharia inversa do player-sorter) ---------- */
const Sorter = (() => {
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function plan(n) { const q = new Array(n).fill(1); let work = 0; while (q.length > 1) { const a = q.shift(), b = q.shift(); work += a + b; q.push(a + b); } return work; }
  const count = gs => gs.reduce((s, g) => s + g.length, 0);
  function next(s) {
    if (s.queue.length < 2) { s.done = true; s.left = s.right = s.merged = null; return; }
    s.left = s.queue.shift(); s.right = s.queue.shift(); s.merged = []; s.i = 0; s.j = 0;
  }
  function settle(s) {
    while (!s.done && (s.i >= s.left.length || s.j >= s.right.length)) {
      const rest = s.i >= s.left.length ? s.right.slice(s.j) : s.left.slice(s.i);
      s.placed += count(rest); s.queue.push(s.merged.concat(rest)); next(s);
    }
  }
  function create(ids) {
    const s = { queue: shuffle(ids).map(id => [[id]]), left: null, right: null, merged: null, i: 0, j: 0, placed: 0, total: plan(ids.length), choices: 0, done: false, history: [] };
    next(s); return s;
  }
  function snap(s) { const { history, ...r } = s; return JSON.stringify(r); }
  function current(s) { return s.done ? null : { left: s.left[s.i][0], right: s.right[s.j][0] }; }
  function choose(s, pick) {
    if (s.done) return;
    s.history.push(snap(s));
    const l = s.left[s.i], r = s.right[s.j];
    if (pick === "left") { s.merged.push(l); s.placed += l.length; s.i++; }
    else if (pick === "right") { s.merged.push(r); s.placed += r.length; s.j++; }
    else { s.merged.push(l.concat(r)); s.placed += l.length + r.length; s.i++; s.j++; }
    s.choices++; settle(s);
  }
  function undo(s) { if (!s.history.length) return false; Object.assign(s, JSON.parse(s.history.pop())); return true; }
  function progress(s) { return s.done || !s.total ? 1 : s.placed / s.total; }
  function ranking(s) { const out = []; let rank = 1; (s.queue[0] || []).forEach(g => { out.push({ rank, ids: g.slice() }); rank += g.length; }); return out; }
  return { create, choose, undo, current, progress, ranking };
})();

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const allMembers = () => MEMBERS;
const byId = id => allMembers().find(m => m.id === id);
const off = () => store.get("off", []);
const activeIds = () => allMembers().map(m => m.id).filter(id => !off().includes(id));
const catById = id => CATEGORIES.find(c => c.id === id);
const myName = () => store.get("me", "");
const fmtDate = d => new Date(d).toLocaleDateString("pt-PT", { day: "numeric", month: "short", year: "numeric" });
function avatar(m, size) {
  const st = size ? ' style="--s:' + size + 'px"' : "";
  return '<span class="av"' + st + ">" + (m.photo ? '<img src="' + m.photo + '" alt="">' : '<span class="ini">' + esc(initials(m.name)) + "</span>") + "</span>";
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }
function view(html) { $app.innerHTML = html; window.scrollTo(0, 0); }

function crest() { return '<span class="crest" aria-hidden="true"><img src="' + CREST + '" alt=""></span>'; }

let session = null; // { cat, state }

/* ---------- ecrã inicial ---------- */
function renderHome() {
  session = null;
  const results = store.get("results", []);
  const members = allMembers();
  const offs = off();
  view(
    '<header class="hero"><img src="' + HERO + '" alt="O Bordel Amigável todo junto"><div class="hero-in">' + crest() +
      '<div><h1>Bordel Amigável</h1><p class="members-count">Rankings do grupo · ' + activeIds().length + " membros em jogo</p></div>" +
    "</div></header>" +

    '<div class="me-row"><label for="me">O teu nome</label><input id="me" class="field" placeholder="Aparece no cartaz do ranking" value="' + esc(myName()) + '"></div>' +

    '<section class="section-h"><h2>Categorias</h2><small>Escolhe uma e vai decidindo frente a frente</small></section>' +
    '<div class="cats">' + CATEGORIES.map(c => {
      const st = store.get("state:" + c.id, null);
      let tag = '<span class="cat-state">Por ordenar</span>';
      if (st && st.done) tag = '<span class="cat-state done">Feito · ver ranking</span>';
      else if (st && st.choices) tag = '<span class="cat-state mid">A meio · ' + Math.round(Sorter.progress(st) * 100) + "%</span>";
      return '<button class="cat" data-cat="' + c.id + '"><span class="cat-name">' + esc(c.name) + '</span><span class="cat-q">' + esc(c.q) + "</span>" + tag + "</button>";
    }).join("") + "</div>" +

    '<section class="section-h"><h2>Quem entra</h2><small>Toca para tirar ou pôr alguém · vale para os rankings novos</small></section>' +
    '<div class="members">' + members.map(m =>
      '<button class="mem" data-mem="' + m.id + '" aria-pressed="' + (!offs.includes(m.id)) + '">' + avatar(m, 30) + '<span class="nm">' + esc(m.name) + "</span></button>"
    ).join("") + "</div>" +

    '<section class="section-h"><h2>Os meus rankings</h2><small>Guardados só neste browser</small></section>' +
    (results.length
      ? '<div class="hist">' + results.slice().reverse().map((r, i) => {
          const c = catById(r.cat); const top = r.ranking.slice(0, 3).map(x => x.ids.map(id => (byId(id) || { name: "?" }).name).join(" / ")).join(" · ");
          return '<button class="hist-item" data-hist="' + (results.length - 1 - i) + '"><b>' + esc(c ? c.name : r.cat) + "</b><span>" + esc(top) + '</span><span style="flex:none">' + fmtDate(r.at) + "</span></button>";
        }).join("") + "</div>"
      : '<p class="empty">Ainda não acabaste nenhum. Quando acabares, o cartaz fica aqui.</p>')
  );

  document.getElementById("me").addEventListener("input", e => store.set("me", e.target.value.trim()));
  $app.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => openCategory(b.dataset.cat)));
  $app.querySelectorAll("[data-mem]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.mem; let o = off();
    o = o.includes(id) ? o.filter(x => x !== id) : o.concat(id);
    if (allMembers().length - o.length < 2) { toast("Têm de ficar pelo menos 2"); return; }
    store.set("off", o); b.setAttribute("aria-pressed", String(!o.includes(id)));
    document.querySelector(".members-count").textContent = "Rankings do grupo · " + activeIds().length + " membros em jogo";
  }));
  $app.querySelectorAll("[data-hist]").forEach(b => b.addEventListener("click", () => renderResult(store.get("results", [])[+b.dataset.hist])));

}

/* ---------- abrir categoria ---------- */
function openCategory(catId) {
  const saved = store.get("state:" + catId, null);
  if (saved && saved.done) { const r = latestResult(catId); if (r) { renderResult(r); return; } }
  if (saved && !saved.done && saved.choices > 0) { session = { cat: catId, state: saved }; renderBattle(); return; }
  startFresh(catId);
}
function startFresh(catId) {
  const ids = activeIds();
  session = { cat: catId, state: Sorter.create(ids) };
  renderBattle();
}
function latestResult(catId) { const r = store.get("results", []).filter(x => x.cat === catId); return r[r.length - 1]; }

/* ---------- frente a frente ---------- */
function renderBattle() {
  const { cat, state } = session;
  store.set("state:" + cat, state);
  if (state.done) { finish(); return; }
  const c = catById(cat);
  const pair = Sorter.current(state);
  const pct = Math.round(Sorter.progress(state) * 100);
  const card = (side, id) => { const m = byId(id) || { name: "?" }; return '<button class="pick" data-pick="' + side + '"><span class="pick-key">' + (side === "left" ? "←" : "→") + "</span>" + avatar(m) + '<span class="pick-name">' + esc(m.name) + "</span></button>"; };
  view(
    '<section class="battle">' +
      '<header class="band battle-head">' + crest() + "<div><h1>" + esc(c.name) + "</h1><p>Bordel Amigável" + (myName() ? " · Ranking do " + esc(myName()) : "") + "</p></div></header>" +
      '<div class="battle-top"><span>Duelo ' + (state.choices + 1) + "</span><span>" + pct + "% ordenado</span></div>" +
      '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
      '<h2 class="battle-q">' + esc(c.q) + "</h2>" +
      '<div class="arena">' + card("left", pair.left) + '<span class="vs">VS</span>' + card("right", pair.right) + "</div>" +
      '<div class="battle-actions">' +
        '<button class="btn btn-ghost" data-act="undo"' + (state.history.length ? "" : " disabled") + ">Desfazer</button>" +
        '<button class="btn btn-tie" data-pick="tie">Empate</button>' +
        '<button class="btn btn-ghost" data-act="quit">Guardar e sair</button>' +
      "</div>" +
      '<p class="hint">Teclado: ← / → para escolher, ↓ para empate, Backspace para desfazer</p>' +
    "</section>"
  );
  $app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => pick(b.dataset.pick)));
  $app.querySelector('[data-act="undo"]').addEventListener("click", undo);
  $app.querySelector('[data-act="quit"]').addEventListener("click", renderHome);
}
function pick(which) {
  if (!session || session.state.done) return;
  const el = $app.querySelector('[data-pick="' + which + '"]'); if (el) el.classList.add("hit");
  Sorter.choose(session.state, which); renderBattle();
}
function undo() { if (session && Sorter.undo(session.state)) renderBattle(); }
function finish() {
  const { cat, state } = session;
  const r = { cat, at: Date.now(), by: myName(), ranking: Sorter.ranking(state), n: activeIds().length };
  const list = store.get("results", []); list.push(r); store.set("results", list.slice(-60));
  const slim = { ...state, history: [] }; store.set("state:" + cat, slim);
  session = null;
  renderResult(r);
}

/* ---------- cartaz final ---------- */
function renderResult(r) {
  const c = catById(r.cat);
  const entries = [];
  r.ranking.forEach(row => row.ids.forEach(id => { const m = byId(id); if (m) entries.push({ m, rank: row.rank, tied: row.ids.length > 1 }); }));
  const rk = e => e.rank + (e.tied ? "<small>=</small>" : "");
  const top = entries.slice(0, 3), rest = entries.slice(3);
  const sub = e => e.rank === 1 ? (e.tied ? "Primeiro lugar partilhado" : "Campeão em " + c.name.toLowerCase()) : (e.tied ? "Empatado em " + e.rank + "º" : e.rank + "º lugar");
  const who = r.by ? "Ranking do " + r.by : "Bordel Amigável";
  view(
    '<article class="poster" id="poster">' +
      '<header class="band">' + crest() + "<div><h1>" + esc(c.name) + "</h1><p>" + esc(who) + " · " + fmtDate(r.at) + "</p></div></header>" +
      '<div class="board">' +
        top.map(e => '<div class="row big' + (e.rank === 1 ? " r1" : "") + '"><span class="rk">' + rk(e) + "</span>" + avatar(e.m) + '<span class="nm">' + esc(e.m.name) + '<span class="sub">' + sub(e) + "</span></span></div>").join("") +
        (rest.length ? '<div class="rest" style="--rows3:' + Math.ceil(rest.length / 3) + ";--rows2:" + Math.ceil(rest.length / 2) + '">' +
          rest.map(e => '<div class="row sm"><span class="rk">' + rk(e) + "</span>" + avatar(e.m) + '<span class="nm">' + esc(e.m.name) + "</span></div>").join("") + "</div>" : "") +
      "</div>" +
      '<footer class="poster-foot"><span class="cta">Faz o teu</span><span class="dt">sassaleitao.github.io/bordel-sorter</span></footer>' +
    "</article>" +
    '<div class="result-actions">' +
      '<button class="btn" data-act="copy">Copiar texto para o grupo</button>' +
      '<button class="btn btn-ghost" data-act="again">Ordenar outra vez</button>' +
      '<button class="btn btn-ghost" data-act="home">Outra categoria</button>' +
    "</div>" +
    '<p class="hint">Faz print ao cartaz e manda para o grupo.</p>'
  );
  $app.querySelector('[data-act="home"]').addEventListener("click", renderHome);
  $app.querySelector('[data-act="again"]').addEventListener("click", () => { store.del("state:" + r.cat); startFresh(r.cat); });
  $app.querySelector('[data-act="copy"]').addEventListener("click", () => {
    const lines = [c.name.toUpperCase() + " · " + who];
    entries.forEach(e => lines.push(e.rank + (e.tied ? "=" : "") + ". " + e.m.name));
    const text = lines.join("\n");
    navigator.clipboard.writeText(text).then(() => toast("Copiado")).catch(() => {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("Não deu para copiar"); }
      ta.remove();
    });
  });
}

/* ---------- teclado ---------- */
document.addEventListener("keydown", e => {
  if (!session || session.state.done || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); pick("left"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); pick("right"); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pick("tie"); }
  else if (e.key === "Backspace") { e.preventDefault(); undo(); }
});

renderHome();
</script>

</body>
</html>
