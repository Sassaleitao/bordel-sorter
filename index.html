<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bordel Amigável Sorter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
/* Layout: cartaz de clube noturno; faixa listrada vinho no topo, filete dourado, cartões creme. Tema único, escuro por escolha. */
:root {
  --wine: #4a0d26;
  --wine-deep: #2a0615;
  --wine-stripe: #5a1530;
  --gold: #e9c27b;
  --gold-deep: #b8893e;
  --cream: #f6ece0;
  --cream-dim: #e8d9c8;
  --ink: #2a0615;
  --ink-soft: #7b4a5c;
  --text: #f6ece0;
  --text-dim: #c9a9b3;
  --line: rgba(233, 194, 123, .22);
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--wine-deep); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }

/* ---------- brasão ---------- */
.crest { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--wine-deep); border: 3px solid var(--gold); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--wine-deep), 0 0 0 5px var(--gold-deep); }
.crest span { font-family: var(--display); color: var(--gold); font-size: 26px; letter-spacing: .02em; line-height: 1; }
.crest.sm { width: 44px; height: 44px; border-width: 2px; box-shadow: 0 0 0 2px var(--wine-deep), 0 0 0 3px var(--gold-deep); }
.crest.sm span { font-size: 17px; }

/* ---------- faixa de cabeçalho ---------- */
.band { position: relative; border-radius: 18px 18px 0 0; overflow: hidden; background: var(--wine) repeating-linear-gradient(90deg, var(--wine) 0 46px, var(--wine-stripe) 46px 92px); border-bottom: 8px solid var(--gold); padding: 22px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: clamp(14px, 3vw, 28px); }
.band h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6.4vw, 56px); line-height: .95; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.band p { margin: 6px 0 0; color: var(--text-dim); font-weight: 500; font-size: 14px; }

/* ---------- home ---------- */
.home-band { border-radius: 18px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-h h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; color: var(--gold); }
.section-h small { color: var(--text-dim); font-size: 13px; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.cat { text-align: left; border: 0; border-radius: 14px; background: var(--cream); color: var(--ink); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 128px; transition: transform .12s ease, box-shadow .12s ease; box-shadow: 0 2px 0 var(--gold-deep); }
.cat:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--gold-deep); }
.cat .cat-name { font-family: var(--display); font-size: 28px; line-height: 1; text-transform: uppercase; }
.cat .cat-q { color: var(--ink-soft); font-size: 13px; font-weight: 500; flex: 1; }
.cat .cat-state { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--cream-dim); color: var(--ink-soft); }
.cat .cat-state.mid { background: var(--gold); color: var(--ink); }
.cat .cat-state.done { background: var(--wine); color: var(--gold); }

.me-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.me-row label { font-weight: 600; color: var(--text-dim); }
.field { background: var(--wine); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; flex: 1 1 180px; max-width: 320px; }
.field::placeholder { color: var(--text-dim); opacity: .7; }

.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mem { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--wine); text-align: left; min-width: 0; transition: opacity .12s; }
.mem .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mem[aria-pressed="false"] { opacity: .38; }
.mem[aria-pressed="false"] .nm { text-decoration: line-through; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- avatar ---------- */
.av { position: relative; flex: none; width: var(--s, 36px); height: var(--s, 36px); border-radius: 50%; background: var(--gold); overflow: hidden; display: grid; place-items: center; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av .ini { font-family: var(--display); color: var(--wine-deep); font-size: calc(var(--s, 36px) * .4); line-height: 1; }

/* ---------- botões ---------- */
.btn { border: 0; border-radius: 99px; padding: 11px 18px; font-weight: 700; font-size: 14px; background: var(--gold); color: var(--ink); }
.btn:hover { background: #f2d395; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--wine); }
.btn-tie { background: var(--cream); color: var(--ink); }
.btn-tie:hover { background: #fff6ea; }
.link { background: none; border: 0; padding: 0; color: var(--gold); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- comparação ---------- */
.battle { display: flex; flex-direction: column; gap: 16px; }
.battle-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.battle-top .cat-tag { color: var(--gold); }
.progress { height: 8px; border-radius: 99px; background: var(--wine); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .25s ease; }
.battle-q { margin: 6px 0 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5.5vw, 44px); text-transform: uppercase; line-height: 1; text-wrap: balance; }
.arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(8px, 2vw, 18px); }
.vs { font-family: var(--display); color: var(--gold); font-size: clamp(22px, 4vw, 34px); }
.pick { position: relative; border: 0; border-radius: 20px; background: var(--cream); color: var(--ink); padding: clamp(16px, 3vw, 26px) 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 4px 0 var(--gold-deep); transition: transform .1s ease, box-shadow .1s ease; min-width: 0; }
.pick:hover { transform: translateY(-3px); box-shadow: 0 7px 0 var(--gold-deep); }
.pick:active, .pick.hit { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-deep); }
.pick .av { --s: clamp(96px, 22vw, 168px); box-shadow: 0 0 0 4px var(--gold); }
.pick-name { font-family: var(--display); font-size: clamp(20px, 3.6vw, 30px); line-height: 1.02; text-transform: uppercase; text-align: center; overflow-wrap: anywhere; }
.pick-key { position: absolute; top: 10px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.pick[data-pick="left"] .pick-key { left: 14px; }
.pick[data-pick="right"] .pick-key { right: 14px; }
.battle-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.hint { margin: 0; text-align: center; color: var(--text-dim); font-size: 12.5px; }

/* ---------- resultado (cartaz para print) ---------- */
.poster { border-radius: 18px; overflow: hidden; background: var(--wine); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
.poster .band { border-radius: 0; }
.board { padding: clamp(14px, 3.5vw, 34px) clamp(12px, 4vw, 40px) 8px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--cream); color: var(--ink); border-radius: 14px; min-width: 0; }
.row .rk { font-family: var(--display); font-style: normal; color: var(--wine); text-align: center; font-variant-numeric: tabular-nums; flex: none; }
.row .rk small { font-size: .7em; }
.row .nm { font-family: var(--display); text-transform: uppercase; line-height: 1.02; min-width: 0; overflow-wrap: anywhere; }
.row.big { padding: 14px clamp(14px, 3vw, 28px); gap: clamp(12px, 3vw, 26px); }
.row.big .rk { font-size: clamp(30px, 6vw, 46px); width: 1.7em; }
.row.big .av { --s: clamp(58px, 10vw, 80px); box-shadow: 0 0 0 3px var(--gold); }
.row.big .nm { font-size: clamp(22px, 4.2vw, 34px); }
.row.big .sub { font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--ink-soft); text-transform: none; margin-top: 3px; display: block; }
.row.big.r1 { background: var(--gold); }
.row.big.r1 .rk { color: var(--wine-deep); }
.rest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(var(--rows3), auto); gap: 8px 12px; }
.row.sm { padding: 6px 10px; gap: 9px; }
.row.sm .rk { font-size: 20px; width: 1.8em; }
.row.sm .av { --s: 32px; }
.row.sm .nm { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
.poster-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 18px clamp(12px, 4vw, 40px) 22px; margin-top: 12px; border-top: 1px solid var(--line); }
.poster-foot .cta { font-family: var(--display); font-size: clamp(20px, 3.4vw, 28px); text-transform: uppercase; color: var(--gold); }
.poster-foot .dt { color: var(--text-dim); font-weight: 600; font-size: 14px; }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- histórico ---------- */
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--wine); text-align: left; flex-wrap: wrap; }
.hist-item b { font-family: var(--display); font-weight: 400; font-size: 18px; text-transform: uppercase; color: var(--gold); min-width: 110px; }
.hist-item span { color: var(--text-dim); font-size: 13px; flex: 1; min-width: 0; }
.empty { color: var(--text-dim); font-size: 13.5px; margin: 0; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--cream); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 99px; transition: .2s ease; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 620px) {
  .rest { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows2), auto); }
  .crest { width: 52px; height: 52px; }
  .crest span { font-size: 21px; }
}
@media (max-width: 460px) {
  .arena { grid-template-columns: 1fr; }
  .vs { text-align: center; line-height: 1; }
  .pick { flex-direction: row; justify-content: flex-start; padding: 14px 16px; }
  .pick .av { --s: 84px; }
  .pick-name { text-align: left; }
  .pick-key { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const store = {
  get(k, d) { try { const v = localStorage.getItem("ba:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ba:" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("ba:" + k); } catch (e) {} }
};

/* ---------- ordenação por fusão com empates (engenharia inversa do player-sorter) ---------- */
const Sorter = (() => {
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function plan(n) { const q = new Array(n).fill(1); let work = 0; while (q.length > 1) { const a = q.shift(), b = q.shift(); work += a + b; q.push(a + b); } return work; }
  const count = gs => gs.reduce((s, g) => s + g.length, 0);
  function next(s) {
    if (s.queue.length < 2) { s.done = true; s.left = s.right = s.merged = null; return; }
    s.left = s.queue.shift(); s.right = s.queue.shift(); s.merged = []; s.i = 0; s.j = 0;
  }
  function settle(s) {
    while (!s.done && (s.i >= s.left.length || s.j >= s.right.length)) {
      const rest = s.i >= s.left.length ? s.right.slice(s.j) : s.left.slice(s.i);
      s.placed += count(rest); s.queue.push(s.merged.concat(rest)); next(s);
    }
  }
  function create(ids) {
    const s = { queue: shuffle(ids).map(id => [[id]]), left: null, right: null, merged: null, i: 0, j: 0, placed: 0, total: plan(ids.length), choices: 0, done: false, history: [] };
    next(s); return s;
  }
  function snap(s) { const { history, ...r } = s; return JSON.stringify(r); }
  function current(s) { return s.done ? null : { left: s.left[s.i][0], right: s.right[s.j][0] }; }
  function choose(s, pick) {
    if (s.done) return;
    s.history.push(snap(s));
    const l = s.left[s.i], r = s.right[s.j];
    if (pick === "left") { s.merged.push(l); s.placed += l.length; s.i++; }
    else if (pick === "right") { s.merged.push(r); s.placed += r.length; s.j++; }
    else { s.merged.push(l.concat(r)); s.placed += l.length + r.length; s.i++; s.j++; }
    s.choices++; settle(s);
  }
  function undo(s) { if (!s.history.length) return false; Object.assign(s, JSON.parse(s.history.pop())); return true; }
  function progress(s) { return s.done || !s.total ? 1 : s.placed / s.total; }
  function ranking(s) { const out = []; let rank = 1; (s.queue[0] || []).forEach(g => { out.push({ rank, ids: g.slice() }); rank += g.length; }); return out; }
  return { create, choose, undo, current, progress, ranking };
})();

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const extra = () => store.get("extra", []);
const allMembers = () => MEMBERS.concat(extra());
const byId = id => allMembers().find(m => m.id === id);
const off = () => store.get("off", []);
const activeIds = () => allMembers().map(m => m.id).filter(id => !off().includes(id));
const catById = id => CATEGORIES.find(c => c.id === id);
const myName = () => store.get("me", "");
const fmtDate = d => new Date(d).toLocaleDateString("pt-PT", { day: "numeric", month: "short", year: "numeric" });
function avatar(m, size) {
  const st = size ? ' style="--s:' + size + 'px"' : "";
  return '<span class="av"' + st + ">" + (m.photo ? '<img src="' + m.photo + '" alt="">' : '<span class="ini">' + esc(initials(m.name)) + "</span>") + "</span>";
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }
function view(html) { $app.innerHTML = html; window.scrollTo(0, 0); }
function crest(sm) { return '<span class="crest' + (sm ? " sm" : "") + '" aria-hidden="true"><span>BA</span></span>'; }

let session = null; // { cat, state }

/* ---------- ecrã inicial ---------- */
function renderHome() {
  session = null;
  const results = store.get("results", []);
  const members = allMembers();
  const offs = off();
  view(
    '<header class="band home-band">' + crest() +
      "<div><h1>Bordel Amigável</h1><p>Rankings do grupo · " + activeIds().length + " membros em jogo</p></div>" +
    "</header>" +

    '<div class="me-row"><label for="me">O teu nome</label><input id="me" class="field" placeholder="Aparece no cartaz do ranking" value="' + esc(myName()) + '"></div>' +

    '<section class="section-h"><h2>Categorias</h2><small>Escolhe uma e vai decidindo frente a frente</small></section>' +
    '<div class="cats">' + CATEGORIES.map(c => {
      const st = store.get("state:" + c.id, null);
      let tag = '<span class="cat-state">Por ordenar</span>';
      if (st && st.done) tag = '<span class="cat-state done">Feito · ver ranking</span>';
      else if (st && st.choices) tag = '<span class="cat-state mid">A meio · ' + Math.round(Sorter.progress(st) * 100) + "%</span>";
      return '<button class="cat" data-cat="' + c.id + '"><span class="cat-name">' + esc(c.name) + '</span><span class="cat-q">' + esc(c.q) + "</span>" + tag + "</button>";
    }).join("") + "</div>" +

    '<section class="section-h"><h2>Quem entra</h2><small>Toca para tirar ou pôr alguém · vale para os rankings novos</small></section>' +
    '<div class="members">' + members.map(m =>
      '<button class="mem" data-mem="' + m.id + '" aria-pressed="' + (!offs.includes(m.id)) + '">' + avatar(m, 30) + '<span class="nm">' + esc(m.name) + "</span></button>"
    ).join("") + "</div>" +
    '<form class="add-row" id="add-form"><input id="add-name" class="field" placeholder="Nome de quem falta"><label class="btn btn-ghost" for="add-photo" id="add-photo-lbl">Foto</label><input id="add-photo" type="file" accept="image/*" hidden><button class="btn" type="submit">Adicionar</button></form>' +

    '<section class="section-h"><h2>Os meus rankings</h2><small>Guardados só neste browser</small></section>' +
    (results.length
      ? '<div class="hist">' + results.slice().reverse().map((r, i) => {
          const c = catById(r.cat); const top = r.ranking.slice(0, 3).map(x => x.ids.map(id => (byId(id) || { name: "?" }).name).join(" / ")).join(" · ");
          return '<button class="hist-item" data-hist="' + (results.length - 1 - i) + '"><b>' + esc(c ? c.name : r.cat) + "</b><span>" + esc(top) + '</span><span style="flex:none">' + fmtDate(r.at) + "</span></button>";
        }).join("") + "</div>"
      : '<p class="empty">Ainda não acabaste nenhum. Quando acabares, o cartaz fica aqui.</p>')
  );

  document.getElementById("me").addEventListener("input", e => store.set("me", e.target.value.trim()));
  $app.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => openCategory(b.dataset.cat)));
  $app.querySelectorAll("[data-mem]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.mem; let o = off();
    o = o.includes(id) ? o.filter(x => x !== id) : o.concat(id);
    if (allMembers().length - o.length < 2) { toast("Têm de ficar pelo menos 2"); return; }
    store.set("off", o); b.setAttribute("aria-pressed", String(!o.includes(id)));
    document.querySelector(".home-band p").textContent = "Rankings do grupo · " + activeIds().length + " membros em jogo";
  }));
  $app.querySelectorAll("[data-hist]").forEach(b => b.addEventListener("click", () => renderResult(store.get("results", [])[+b.dataset.hist])));

  let pendingPhoto = null;
  document.getElementById("add-photo").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 160;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
      pendingPhoto = c.toDataURL("image/jpeg", .85); URL.revokeObjectURL(url);
      document.getElementById("add-photo-lbl").textContent = "Foto ✓";
    };
    img.src = url;
  });
  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("add-name").value.trim();
    if (!name) { toast("Escreve o nome primeiro"); return; }
    const list = extra(); list.push({ id: "x-" + Date.now().toString(36), name, photo: pendingPhoto });
    store.set("extra", list); toast(name + " entrou"); renderHome();
  });
}

/* ---------- abrir categoria ---------- */
function openCategory(catId) {
  const saved = store.get("state:" + catId, null);
  if (saved && saved.done) { const r = latestResult(catId); if (r) { renderResult(r); return; } }
  if (saved && !saved.done && saved.choices > 0) { session = { cat: catId, state: saved }; renderBattle(); return; }
  startFresh(catId);
}
function startFresh(catId) {
  const ids = activeIds();
  session = { cat: catId, state: Sorter.create(ids) };
  renderBattle();
}
function latestResult(catId) { const r = store.get("results", []).filter(x => x.cat === catId); return r[r.length - 1]; }

/* ---------- frente a frente ---------- */
function renderBattle() {
  const { cat, state } = session;
  store.set("state:" + cat, state);
  if (state.done) { finish(); return; }
  const c = catById(cat);
  const pair = Sorter.current(state);
  const pct = Math.round(Sorter.progress(state) * 100);
  const card = (side, id) => { const m = byId(id) || { name: "?" }; return '<button class="pick" data-pick="' + side + '"><span class="pick-key">' + (side === "left" ? "←" : "→") + "</span>" + avatar(m) + '<span class="pick-name">' + esc(m.name) + "</span></button>"; };
  view(
    '<section class="battle">' +
      '<div class="battle-top"><span><span class="cat-tag">' + esc(c.name) + "</span> · Duelo " + (state.choices + 1) + "</span><span>" + pct + "% ordenado</span></div>" +
      '<div class="progress"><span style="width:' + pct + '%"></span></div>' +
      '<h2 class="battle-q">' + esc(c.q) + "</h2>" +
      '<div class="arena">' + card("left", pair.left) + '<span class="vs">VS</span>' + card("right", pair.right) + "</div>" +
      '<div class="battle-actions">' +
        '<button class="btn btn-ghost" data-act="undo"' + (state.history.length ? "" : " disabled") + ">Desfazer</button>" +
        '<button class="btn btn-tie" data-pick="tie">Empate</button>' +
        '<button class="btn btn-ghost" data-act="quit">Guardar e sair</button>' +
      "</div>" +
      '<p class="hint">Teclado: ← / → para escolher, ↓ para empate, Backspace para desfazer</p>' +
    "</section>"
  );
  $app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => pick(b.dataset.pick)));
  $app.querySelector('[data-act="undo"]').addEventListener("click", undo);
  $app.querySelector('[data-act="quit"]').addEventListener("click", renderHome);
}
function pick(which) {
  if (!session || session.state.done) return;
  const el = $app.querySelector('[data-pick="' + which + '"]'); if (el) el.classList.add("hit");
  Sorter.choose(session.state, which); renderBattle();
}
function undo() { if (session && Sorter.undo(session.state)) renderBattle(); }
function finish() {
  const { cat, state } = session;
  const r = { cat, at: Date.now(), by: myName(), ranking: Sorter.ranking(state), n: activeIds().length };
  const list = store.get("results", []); list.push(r); store.set("results", list.slice(-60));
  const slim = { ...state, history: [] }; store.set("state:" + cat, slim);
  session = null;
  renderResult(r);
}

/* ---------- cartaz final ---------- */
function renderResult(r) {
  const c = catById(r.cat);
  const entries = [];
  r.ranking.forEach(row => row.ids.forEach(id => { const m = byId(id); if (m) entries.push({ m, rank: row.rank, tied: row.ids.length > 1 }); }));
  const rk = e => e.rank + (e.tied ? "<small>=</small>" : "");
  const top = entries.slice(0, 3), rest = entries.slice(3);
  const sub = e => e.rank === 1 ? (e.tied ? "Primeiro lugar partilhado" : "Campeão em " + c.name.toLowerCase()) : (e.tied ? "Empatado em " + e.rank + "º" : e.rank + "º lugar");
  const who = r.by ? "Ranking do " + r.by : "Bordel Amigável";
  view(
    '<article class="poster" id="poster">' +
      '<header class="band">' + crest() + "<div><h1>" + esc(c.name) + "</h1><p>" + esc(who) + " · " + entries.length + " membros · " + fmtDate(r.at) + "</p></div></header>" +
      '<div class="board">' +
        top.map(e => '<div class="row big' + (e.rank === 1 ? " r1" : "") + '"><span class="rk">' + rk(e) + "</span>" + avatar(e.m) + '<span class="nm">' + esc(e.m.name) + '<span class="sub">' + sub(e) + "</span></span></div>").join("") +
        (rest.length ? '<div class="rest" style="--rows3:' + Math.ceil(rest.length / 3) + ";--rows2:" + Math.ceil(rest.length / 2) + '">' +
          rest.map(e => '<div class="row sm"><span class="rk">' + rk(e) + "</span>" + avatar(e.m) + '<span class="nm">' + esc(e.m.name) + "</span></div>").join("") + "</div>" : "") +
      "</div>" +
      '<footer class="poster-foot"><span class="cta">Ordena o teu</span><span class="dt">Bordel Amigável · ' + esc(c.q) + "</span></footer>" +
    "</article>" +
    '<div class="result-actions">' +
      '<button class="btn" data-act="copy">Copiar texto para o grupo</button>' +
      '<button class="btn btn-ghost" data-act="again">Ordenar outra vez</button>' +
      '<button class="btn btn-ghost" data-act="home">Outra categoria</button>' +
    "</div>" +
    '<p class="hint">Faz print ao cartaz e manda para o grupo.</p>'
  );
  $app.querySelector('[data-act="home"]').addEventListener("click", renderHome);
  $app.querySelector('[data-act="again"]').addEventListener("click", () => { store.del("state:" + r.cat); startFresh(r.cat); });
  $app.querySelector('[data-act="copy"]').addEventListener("click", () => {
    const lines = [c.name.toUpperCase() + " · " + who];
    entries.forEach(e => lines.push(e.rank + (e.tied ? "=" : "") + ". " + e.m.name));
    const text = lines.join("\n");
    navigator.clipboard.writeText(text).then(() => toast("Copiado")).catch(() => {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copiado"); } catch (e) { toast("Não deu para copiar"); }
      ta.remove();
    });
  });
}

/* ---------- teclado ---------- */
document.addEventListener("keydown", e => {
  if (!session || session.state.done || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); pick("left"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); pick("right"); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pick("tie"); }
  else if (e.key === "Backspace") { e.preventDefault(); undo(); }
});

renderHome();
</script>
</body>
</html>
